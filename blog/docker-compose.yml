version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: my_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mypassword
      MYSQL_DATABASE: blogdb
      MYSQL_USER: bloguser
      MYSQL_PASSWORD: blogpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  flask:
    build: .
    container_name: my_flask_app
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    environment:
      - SECRET_KEY=your_super_secret_key_here
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=blogdb
      - MYSQL_USER=bloguser
      - MYSQL_PASSWORD=blogpass

volumes:
  mysql_data:
