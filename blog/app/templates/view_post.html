<!-- templates/view_post.html -->
{% extends "layout.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h2>{{ post.title }}</h2>
            <small class="text-muted">Posted by {{ post.author.username }} on {{ post.created_at.strftime('%B %d, %Y') }}</small>
        </div>
        <div class="card-body">
            <p>{{ post.content }}</p>
        </div>
    </div>

    {% if current_user.is_authenticated and current_user.id == post.author_id %}
    <div class="mt-3">
        <a href="{{ url_for('posts.edit_post', post_id=post.id) }}" class="btn btn-primary">Edit</a>

        <form action="{{ url_for('posts.delete_post_ui', post_id=post.id) }}" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this post?');">
            <button type="submit" class="btn btn-danger">Delete</button>
        </form>
    </div>
    {% endif %}

    <a href="{{ url_for('main.index') }}" class="btn btn-secondary mt-3">Back to Home</a>
</div>
{% endblock %}
