{% extends "layout.html" %}

{% block title %}Register - FlaskBlog{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 450px;">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h2 class="text-center mb-4 text-primary fw-bold">Create an Account</h2>

      <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-person-fill"></i>
            </span>
            <input
              type="text"
              name="username"
              id="username"
              class="form-control"
              placeholder="Enter username"
              required
            >
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-envelope-fill"></i>
            </span>
            <input
              type="email"
              name="email"
              id="email"
              class="form-control"
              placeholder="Enter email"
              required
            >
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock-fill"></i>
            </span>
            <input
              type="password"
              name="password"
              id="password"
              class="form-control"
              placeholder="Create password"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100 fw-semibold shadow-sm">
          Register
        </button>
      </form>

      <div class="mt-4 text-center small text-muted">
        Already have an account?
        <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">
          Login
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
