{% extends 'layout.html' %}
{% block content %}
<h2>{{ 'Edit' if post else 'New' }} Post</h2>

<!-- Load Quill styles -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<form method="post">
    <div class="mb-3">
        <label>Title</label>
        <input type="text" name="title" class="form-control" value="{{ post.title if post else '' }}" required>
    </div>

    <div class="mb-3">
        <label>Content</label>
        <!-- Quill Editor -->
        <div id="editor" class="form-control" style="height: 300px;">{{ post.content|safe if post else '' }}</div>
        <!-- Hidden input to store Quill HTML content -->
        <input type="hidden" name="content" id="content">
    </div>

    <button type="submit" class="btn btn-primary">{{ 'Update' if post else 'Create' }}</button>
</form>

<!-- Load Quill scripts -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
    var quill = new Quill('#editor', { theme: 'snow' });

    // On form submission, set hidden input to Quill's HTML
    document.querySelector('form').onsubmit = function () {
        document.querySelector('#content').value = quill.root.innerHTML;
    };
</script>
{% endblock %}
